<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Classificador de Emails AutoU</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <h2 class="mb-4 text-center text-primary">Classificador de Emails</h2>
        <form id="emailForm" enctype="multipart/form-data" class="bg-white p-4 rounded shadow">
          <div class="mb-3">
            <label for="emailFile" class="form-label">Upload de arquivo (.txt ou .pdf):</label>
            <input type="file" class="form-control" id="emailFile" name="emailFile" accept=".txt,.pdf">
          </div>
          <div class="mb-3">
            <label for="emailText" class="form-label">Ou insira o texto do email:</label>
            <textarea class="form-control" id="emailText" name="emailText" rows="5"></textarea>
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100" disabled>Processar</button>


          <!-- Spinner de carregamento -->
          <div id="loadingSpinner" class="text-center mt-3" style="display: none;">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Carregando...</span>
            </div>
          </div>

          <!-- Barra de progresso -->
          <div id="progressBar" class="progress mt-3" style="height: 20px; display: none;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar"
                 style="width: 100%">Processando...</div>
          </div>
        </form>

        <!-- Resultado -->
        <div id="result" class="mt-4"></div>
      </div>
    </div>
  </div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
